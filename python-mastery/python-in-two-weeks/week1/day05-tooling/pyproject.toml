# Template pyproject.toml — copy this into new projects.
[project]
name = "demo"
version = "0.1.0"
description = "Template project"
requires-python = ">=3.12"
dependencies = [
    # runtime deps, e.g. "httpx>=0.27",
]

[project.scripts]
# demo = "demo.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
