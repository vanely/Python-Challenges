[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notesql"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["polars>=1.0"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["notesql"]

[tool.ruff]
line-length = 100
target-version = "py312"
