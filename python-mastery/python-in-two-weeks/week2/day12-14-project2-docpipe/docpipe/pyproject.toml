[project]
name = "docpipe"
version = "0.1.0"
description = "PDF -> chunks -> SQLite FTS -> search API"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=4",
    "typer>=0.12",
    "rich>=13",
    "polars>=1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
]

[project.scripts]
docpipe = "docpipe.cli:app"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
[tool.mypy]
strict = true
[[tool.mypy.overrides]]
module = ["pypdf.*"]
ignore_missing_imports = true
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
