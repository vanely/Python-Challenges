[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pkgtemplate"
dynamic = ["version"]                       # from git tags via hatch-vcs
description = "A template for modern, typed, CI-ready Python packages"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["template", "packaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]           # for USERS: pip install pkgtemplate[cli]
cli = ["typer>=0.12"]

[dependency-groups]                        # for DEVELOPERS (PEP 735): uv sync installs these
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "nox>=2024.4"]

[project.scripts]
pkgtemplate = "pkgtemplate.cli:main"

[project.urls]
Homepage = "https://github.com/you/pkgtemplate"
Changelog = "https://github.com/you/pkgtemplate/blob/main/CHANGELOG.md"

[tool.hatch.version]
source = "vcs"                             # git describe -> 1.2.0, 1.2.1.dev3+g<sha>, ...
[tool.hatch.version.raw-options]
local_scheme = "no-local-version"          # TestPyPI rejects local versions (+gabc123)
[tool.hatch.build.hooks.vcs]
version-file = "src/pkgtemplate/_version.py"     # generated on install/build; gitignored

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/pkgtemplate/_version.py"]  # generated by hatch-vcs
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = ["D100", "D104", "D203", "D213"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"noxfile.py" = ["D"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unreachable = true
packages = ["pkgtemplate"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=pkgtemplate --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["pkgtemplate"]
