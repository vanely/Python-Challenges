[project]
name = "tinyorm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["UP046", "UP047"]  # Generic[T] kept deliberately: it is the form you will read in libraries
[tool.mypy]
strict = true
[tool.pytest.ini_options]
testpaths = ["tests"]
