[package]
name = "logparse_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }   # 0.28: last line supporting 3.13t (0.29 drops it); 3.12–3.14 ok
# rayon = "1"            # exercise 1

[profile.release]
lto = true
codegen-units = 1
