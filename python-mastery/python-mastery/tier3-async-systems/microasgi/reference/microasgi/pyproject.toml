[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "microasgi"
version = "0.1.0"
description = "A ~400-line ASGI framework built to understand Starlette"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "uvicorn", "mypy", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/microasgi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
